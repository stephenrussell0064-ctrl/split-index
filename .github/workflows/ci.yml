# Continuous integration — the gate that makes every other check load-bearing.
#
# WHY THIS FILE EXISTS
# --------------------
# Before it, this repository had 1347 passing tests and nothing that ran them.
# Tests pass on whichever machine happened to run them, which means a commit
# that breaks the suite merges silently and the breakage is found later by a
# person rather than sooner by a machine. Every hardening work package planned
# for this repo ends in a test as its acceptance criterion — an RLS enumeration,
# a fuzz sweep, an entitlement matrix — and a test nothing runs is a comment.
# So this lands first, before the fixes it is meant to hold.
#
# WHAT IS AND IS NOT A GATE, AND WHY
# ----------------------------------
# `test` and `typecheck` block. Both are green on this commit — 1347/1347 and
# zero tsc errors — so they gate from day one rather than starting red and
# training everyone to ignore them.
#
# `lint` does NOT block, deliberately, and is expected to stay non-blocking
# only until someone ratchets it. Two separate reasons, worth writing down so
# the next person does not have to rediscover them:
#
#   1. `npx eslint` with no path argument reports 286 errors, and 285 of them
#      are `@typescript-eslint/no-require-imports` inside nineteen vendored
#      copies of the same agent-tooling skill pack (.claude/, .cursor/,
#      .gemini/, .github/prompts/ and so on). That is third-party content we
#      neither wrote nor ship. The fix is an eslint ignore entry, which is a
#      config change and belongs in its own commit — so this job lints `src`
#      only, which is the code that is actually ours.
#   2. Scoped to `src`, this once reported 1 error — `react-hooks/set-state-in-
#      effect` at src/components/social/leaderboard-panel.tsx:275 — so the job
#      ran with `continue-on-error` rather than failing every PR on a
#      pre-existing problem.
#
# That exemption is gone, and it is worth saying why it had to go. A second
# violation of the same rule arrived in settings/article9-consent-card.tsx and
# was absorbed silently, because a blanket `continue-on-error` cannot tell a
# known problem from a new one. Both sites now carry a targeted
# eslint-disable-next-line with the reason written above it, `npx eslint src`
# exits 0, and the job blocks. A third violation will now fail, which is the
# entire point.
#
# Warnings (14 at time of writing, mostly unused vars) do not fail eslint and
# are left visible rather than suppressed.
#
# NO BUILD JOB, DELIBERATELY. Vercel builds every push already; duplicating
# `next build` here would double the minutes to learn the same thing. If the
# Vercel connection is ever removed, add one.
#
# THAT MATTERS FOR WP2, SO BE CLEAR ABOUT WHERE THAT GATE LIVES. The
# client-bundle secret scanner runs as part of `npm run build`, which means it
# runs on Vercel — a deploy carrying a service-role key in a client chunk fails
# there and never publishes. It cannot run here, because there is no bundle to
# scan without a build.
#
# What CI covers instead is the scanner's own behaviour:
# scripts/check-client-bundle.test.ts asserts what it catches AND what it must
# not catch, and src/lib/supabase/admin-inventory.test.ts fails if a new
# elevated-credential call site appears without being documented. Those are the
# parts that rot silently. If the Vercel connection is removed, the build job
# added above must run `npm run build` and not `next build`, or the gate goes
# with it.
#
# NO SECRETS REQUIRED. Verified: the suite runs green in a checkout with no
# .env file of any kind, which is exactly the condition a runner starts in. If
# a future test needs a credential, that is a signal it is reaching a real
# service and should be mocked instead.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run irrelevant. Cancel it
# rather than paying for both and reading the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the version this project is developed against. `npm ci`
          # honours package-lock.json exactly, so the only remaining source of
          # drift between a laptop and a runner is the Node major.
          node-version: "24"
          cache: npm

      # `npm ci` runs the postinstall patch (scripts/patch-capacitor-spm.mjs).
      # That script is defensive — it skips silently when the plugin is absent
      # and warns rather than throwing when upstream changes shape — so it
      # cannot fail an install on a Linux runner that will never build for iOS.
      - run: npm ci

      - run: npm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # --noEmit: we want the diagnostics, not the output. `next build` also
      # type-checks, but it runs on Vercel after this would have caught it.
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # `continue-on-error: true` used to live here, waiting on
    # src/components/social/leaderboard-panel.tsx:275. That line and one other
    # (settings/article9-consent-card.tsx) now carry targeted
    # eslint-disable-next-line directives with the reason written above them,
    # so `npx eslint src` exits 0 and the job can block again. That is the
    # point of removing it: a blanket exemption silently absorbed the second
    # violation when it arrived, and would have absorbed the third.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx eslint src
