  <!-- SPLIT INDEX — horizontal lockup, dark-background variant.
       The wordmark is OUTLINED: real Unbounded 900 (and 500 for the slash),
       plus Space Grotesk for the tagline, converted to paths. It used to be
       live <text>, which meant anything rasterising this file without those
       fonts installed silently fell back to Arial Black — which is what every
       app icon and splash screen was built from. Outlines render identically
       everywhere and need no font at all.

       The runs are laid out sequentially rather than at the old hardcoded
       x positions (264/512/556): those were fitted to the fallback's metrics,
       and in real Unbounded SPLIT is wide enough that the slash collided with
       its T. -->
