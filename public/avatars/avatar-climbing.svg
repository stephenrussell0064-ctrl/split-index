<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Climbing">
  <defs>
    <radialGradient id="climbBg" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#ffc98a" />
      <stop offset="55%" stop-color="#e2662c" />
      <stop offset="100%" stop-color="#5c1c08" />
    </radialGradient>
    <filter id="climbHalo" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="thick" />
      <feFlood flood-color="#ffffff" />
      <feComposite in2="thick" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="14" y="14" width="484" height="484" rx="98" fill="url(#climbBg)" stroke="#0a0a0a" stroke-width="26" />

  <!-- Holds, placed in empty ground only. The first version put them under the
       hands and feet, where they were invisible and the pose read as a star jump. -->
  <g filter="url(#climbHalo)" fill="#2a1005">
    <circle cx="372" cy="128" r="20" />
    <circle cx="146" cy="252" r="17" />
    <circle cx="384" cy="330" r="18" />
  </g>

  <g filter="url(#climbHalo)" fill="none" stroke="#2a1005" stroke-linecap="round" stroke-linejoin="round">
    <!-- Asymmetry is what separates climbing from jumping: one arm committed
         overhead, the other low and folded in; legs tucked at different heights. -->
    <!-- tucked leg, high and folded -->
    <path d="M280 322 L212 342" stroke-width="42" />
    <path d="M212 342 L226 400" stroke-width="34" />
    <!-- standing leg, dropped long -->
    <path d="M280 322 L334 378" stroke-width="42" />
    <path d="M334 378 L324 442" stroke-width="34" />
    <!-- torso, near vertical and pressed to the wall -->
    <path d="M280 322 L264 206" stroke-width="48" />
    <!-- reaching arm, straight overhead -->
    <path d="M264 206 L232 150" stroke-width="34" />
    <path d="M232 150 L242 86" stroke-width="27" />
    <!-- low arm, folded in at the chest -->
    <path d="M264 206 L322 236" stroke-width="34" />
    <path d="M322 236 L302 290" stroke-width="27" />
  </g>
  <circle cx="288" cy="166" r="33" fill="#2a1005" filter="url(#climbHalo)" />
</svg>
